# Build the admin panel in CI, publish it as a branch the server pulls.
#
# WHY NOT SSH
# The obvious shape — rsync over SSH from the runner — cannot work on this
# account. Port 22 answers "connection refused", 2222 times out, FTP is closed
# and WHM is not accessible. Nothing inbound is reachable, and a runner has no
# fixed IP to whitelist even if it were.
#
# So the direction is reversed. CI publishes; the box pulls, on a cPanel cron
# job (scripts/cpanel-pull.sh). No ports, no firewall rules, no deploy key on a
# public repo.
#
# WHY A BUILD STEP AT ALL
# `strapi build` peaks at 1.69GB RSS. The account has 2GB, shared with
# Passenger and MySQL — that is what `spawn node EAGAIN` has been saying. It
# takes 13.9s on a 16GB runner.
#
# It also fixes a quieter failure: building on an Apple Silicon Mac produces a
# darwin-arm64 node_modules, and `sharp` — a hard dependency of @strapi/upload —
# cannot be loaded on Linux. A hand deploy could report success and leave a CMS
# that will not boot.

name: Publish CMS build

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two runs force-pushing the same branch would race, and the loser silently
# wins on the server — whichever the box happened to fetch.
concurrency:
  group: publish-cms
  cancel-in-progress: false

permissions:
  contents: write   # force-push the deploy branch

jobs:
  publish:
    runs-on: ubuntu-latest   # linux-x64, matching the server — never a Mac
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # must match the cPanel Node.js selector
          cache: npm

      # Full install: the admin build needs the dev toolchain.
      - run: npm ci

      - name: Build admin panel
        run: npm run build
        env:
          NODE_ENV: production

      # Record what the server is getting. cpanel-pull.sh reads this to decide
      # whether anything changed, and it is what /api/version would report if
      # Strapi had one — the only way to tell a stale deploy from a stale cache.
      - name: Stamp the commit
        run: git rev-parse --short=12 HEAD > DEPLOY_SHA

      # An ORPHAN branch, force-pushed. `dist/` is 13MB and would otherwise be
      # added to history on every single push; as a single rootless commit the
      # branch stays flat forever and the server's --depth=1 clone stays small.
      #
      # node_modules is NOT included: ~800MB is far past what belongs in git.
      # The server installs production deps itself, and only when the lockfile
      # actually moves.
      - name: Publish the deploy branch
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git checkout --orphan deploy

          # `git checkout --orphan` keeps the index, so everything tracked on
          # main is already staged. dist/ is gitignored, hence -f.
          git add -A
          git add -f dist DEPLOY_SHA

          # Never publish these to a branch the server unpacks.
          git rm -r --cached --ignore-unmatch \
            .github node_modules .env .env.local migration/data .seed-token \
            > /dev/null

          git commit -q -m "build ${{ github.sha }}"
          git push -f origin deploy

      - name: Summary
        run: |
          echo "### CMS build published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit \`$(cat DEPLOY_SHA)\` is on the \`deploy\` branch." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The server pulls it within 5 minutes via the cPanel cron job." >> "$GITHUB_STEP_SUMMARY"
          echo "Verify: \`curl -sI https://cms.fakhernco.com/_health\` (expect 204)," >> "$GITHUB_STEP_SUMMARY"
          echo "and check \`~/cms-deploy.log\` on the box." >> "$GITHUB_STEP_SUMMARY"
